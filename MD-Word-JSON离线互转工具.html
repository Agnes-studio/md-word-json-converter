<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD ⇄ Word ⇄ JSON（离线互转）</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0e0f14;--surface:#161820;--surface2:#1e2030;--border:#2a2d3e;--accent:#d4a84b;--accent-dim:#8a6a28;--text:#cdd1de;--muted:#6b7080;--ok:#4ec9a0;--err:#e0617c}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;font-size:14px;line-height:1.7}
  .card{width:100%;max-width:680px}
  h1{font-size:18px;color:var(--accent);margin-bottom:6px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  #ready{font-size:12px;margin-bottom:14px;padding:7px 11px;border-radius:7px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
  #ready.on{color:var(--ok);border-color:#2f6f56}
  #err{display:none;margin-bottom:14px;padding:10px 12px;border-radius:8px;background:rgba(224,97,124,.1);border:1px solid var(--err);color:var(--err);font-size:12px;white-space:pre-wrap;word-break:break-word}
  #drop{display:block;border:2px dashed var(--border);border-radius:14px;padding:38px 24px;text-align:center;cursor:pointer;transition:.15s;background:var(--surface)}
  #drop:hover,#drop.over{border-color:var(--accent-dim);background:rgba(212,168,75,.05)}
  #drop .big{font-size:15px;font-weight:600;margin-bottom:6px;pointer-events:none}
  #drop .small{color:var(--muted);font-size:12px;pointer-events:none}
  #panel{display:none;margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
  #flist{margin-bottom:6px}
  .frow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .frow:last-child{border-bottom:none}
  .frow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{flex:none;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--border);color:var(--accent)}
  .frow.dim{opacity:.4}
  .selrow{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
  .selbox{flex:1;position:relative}
  .sel-label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .sel{width:100%;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:9px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left}
  .sel:hover{border-color:var(--accent-dim)}
  .sel .cur{color:var(--accent);font-weight:600}
  .sel .caret{color:var(--muted);font-size:10px;margin-left:8px}
  .menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:9px;z-index:10;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .menu.open{display:block}
  .menu .opt{padding:10px 12px;font-size:13px;cursor:pointer}
  .menu .opt:hover{background:rgba(212,168,75,.08);color:var(--accent)}
  .menu .opt.on{color:var(--accent);font-weight:600}
  .arrowmid{flex:none;color:var(--accent);font-size:16px;padding:0 2px 13px}
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{flex:1;min-width:150px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent-dim);color:var(--accent)}
  button.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#1a1408;font-weight:600}
  button.primary:hover{background:var(--accent);color:#1a1408}
  button:disabled{opacity:.5;cursor:wait}
  #msg{margin-top:14px;font-size:13px;color:var(--ok);min-height:20px;white-space:pre-wrap}
  #msg.bad{color:var(--err)}
  .note{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.8}
  code{background:#0a0b0f;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h1>MD ⇄ Word ⇄ JSON 互转</h1>
  <div class="sub">全程离线 · 不联网。左边选原始格式，右边选目标格式，拖入文件一键转换（MD / Word / JSON）。</div>

  <div id="ready">正在加载脚本…（如果这行一直是灰的，说明脚本没跑起来，把本页截图给我）</div>
  <div id="err"></div>

  <div class="selrow">
    <div class="selbox">
      <div class="sel-label">原始格式（现在的文件）</div>
      <button type="button" class="sel" id="sel-src"><span class="cur">Markdown (.md)</span><span class="caret">▼</span></button>
      <div class="menu" id="menu-src"></div>
    </div>
    <div class="arrowmid">→</div>
    <div class="selbox">
      <div class="sel-label">目标格式（想要变成的）</div>
      <button type="button" class="sel" id="sel-dst"><span class="cur">Word (.docx)</span><span class="caret">▼</span></button>
      <div class="menu" id="menu-dst"></div>
    </div>
  </div>

  <label id="drop">
    <input type="file" id="file" multiple accept=".md,.markdown,.txt,.docx,.json,.jsonl" style="display:none">
    <div class="big">点这里选择，或把文件拖进来（可多选）</div>
    <div class="small">拖入后会自动识别格式，并同步到左边的下拉框</div>
  </label>

  <div id="panel">
    <div id="flist"></div>
    <div class="btns"><button id="btn-go" class="primary">开始转换</button></div>
    <div id="msg"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
// 任何脚本错误都显示在页面上，方便排查
window.onerror=function(m,src,line,col){var d=document.getElementById('err');if(d){d.style.display='block';d.textContent='脚本出错：'+m+'  (行 '+line+':'+col+')';}return false;};

(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var ENC=new TextEncoder();
var DOCX_MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';

/* ══════════════════ 1. Markdown 解析（文本 → 结构） ══════════════════ */
var ITEM_RE=/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
var HR_RE=/^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})$/;

function parseMd(text){
  var lines=String(text).replace(/^﻿/,'').replace(/\r\n?/g,'\n').split('\n');
  var i=0,blocks=[];
  if(lines[0]==='---'){                                   // YAML frontmatter
    for(var j=1;j<Math.min(lines.length,80);j++){
      if(lines[j]==='---'||lines[j]==='...'){
        var pairs=[];
        for(var k=1;k<j;k++){var mm=lines[k].match(/^([^:\s][^:]*):\s*(.*)$/);if(mm)pairs.push([mm[1].trim(),mm[2]]);else if(lines[k].trim())pairs.push(['',lines[k].trim()]);}
        blocks.push({t:'front',pairs:pairs});i=j+1;break;
      }
    }
  }
  return blocks.concat(parseBlocks(lines.slice(i)));
}

function parseBlocks(lines){
  var blocks=[],i=0,n=lines.length,m;
  while(i<n){
    var line=lines[i];
    if(!line.trim()){i++;continue;}
    if(m=line.match(/^\s*(`{3,}|~{3,})\s*(\S*)\s*$/)){      // 围栏代码块
      var closeRe=new RegExp('^\\s*'+(m[1][0]==='`'?'`':'~')+'{'+m[1].length+',}\\s*$');
      var buf=[];i++;
      while(i<n&&!closeRe.test(lines[i])){buf.push(lines[i]);i++;}
      i++;blocks.push({t:'code',lang:m[2]||'',lines:buf});continue;
    }
    if(m=line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/)){         // 标题
      blocks.push({t:'h',level:m[1].length,inl:parseInline(m[2])});i++;continue;
    }
    if(HR_RE.test(line)){blocks.push({t:'hr'});i++;continue;}
    if(/^\s{0,3}>/.test(line)){                              // 引用块（含 Obsidian callout）
      var q=[];
      while(i<n&&/^\s{0,3}>/.test(lines[i])){q.push(lines[i].replace(/^\s{0,3}> ?/,''));i++;}
      var callout=null;
      if(q.length&&(m=q[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/))){callout={type:m[1].toLowerCase(),title:m[3]};q.shift();}
      blocks.push({t:'quote',callout:callout,blocks:parseBlocks(q)});continue;
    }
    if(ITEM_RE.test(line)){                                  // 列表
      var flat=[];
      while(i<n){
        var l2=lines[i];
        if(!l2.trim()){
          var j2=i+1;while(j2<n&&!lines[j2].trim())j2++;
          if(j2<n&&ITEM_RE.test(lines[j2])){i=j2;continue;}
          break;
        }
        var m2=l2.match(ITEM_RE);
        if(m2&&!HR_RE.test(l2)){flat.push({ind:m2[1].replace(/\t/g,'  ').length,ord:/\d/.test(m2[2][0]),text:m2[3]});i++;}
        else if(/^\s+\S/.test(l2)&&flat.length){flat[flat.length-1].text+='\n'+l2.trim();i++;}
        else break;
      }
      if(flat.length){buildList(flat).forEach(function(lb){blocks.push(lb);});continue;}
    }
    if(line.indexOf('|')>=0&&i+1<n&&isSepRow(lines[i+1])){   // 表格
      var header=splitRow(line);
      var aligns=splitRow(lines[i+1]).map(function(c){var l=/^:/.test(c),r=/:$/.test(c);return l&&r?'center':(r?'right':(l?'left':''));});
      i+=2;var rows=[];
      while(i<n&&lines[i].trim()&&lines[i].indexOf('|')>=0){rows.push(splitRow(lines[i]).map(parseInline));i++;}
      blocks.push({t:'table',header:header.map(parseInline),aligns:aligns,rows:rows});continue;
    }
    var buf2=[line];i++;                                     // 普通段落
    while(i<n&&lines[i].trim()
      &&!/^(#{1,6}\s|\s{0,3}>|\s*(`{3,}|~{3,}))/.test(lines[i])
      &&!ITEM_RE.test(lines[i])&&!HR_RE.test(lines[i])){buf2.push(lines[i]);i++;}
    blocks.push({t:'p',inl:parseInline(buf2.join('\n'))});
  }
  return blocks;
}
function isSepRow(line){
  if(line.indexOf('-')<0)return false;
  var cells=splitRow(line);
  return cells.length>0&&cells.every(function(c){return /^:?-+:?$/.test(c);});
}
function splitRow(line){
  var s=line.trim().replace(/^\|/,'').replace(/\|$/,'');
  return s.replace(/\\\|/g,'␀').split('|').map(function(c){return c.replace(/␀/g,'|').trim();});
}
function buildList(flat){
  function build(idx,indent){
    var list={t:'list',ordered:flat[idx].ord,items:[]},i=idx;
    while(i<flat.length&&flat[i].ind>=indent){
      if(flat[i].ind>=indent+2){
        var r=build(i,flat[i].ind);
        if(!list.items.length)list.items.push({inl:[],task:null,children:[]});
        list.items[list.items.length-1].children.push(r.list);
        i=r.next;
      }else{
        if(list.items.length&&flat[i].ord!==list.ordered)break;  // 圆点↔编号切换 → 另起一个列表
        var text=flat[i].text,task=null,tm=text.match(/^\[([ xX])\]\s+(.*)$/);
        if(tm){task=tm[1]!==' ';text=tm[2];}
        list.items.push({inl:parseInline(text),task:task,children:[]});
        i++;
      }
    }
    return {list:list,next:i};
  }
  var out=[],i=0;
  while(i<flat.length){var r=build(i,flat[i].ind);out.push(r.list);i=r.next;}
  return out;
}

/* 行内格式 → run 数组 {text,b,i,code,strike,link} */
function parseInline(s,fmt){
  fmt=fmt||{};
  var re=/(`+)([\s\S]+?)\1|(\*\*\*|___)([\s\S]+?)\3|(\*\*|__)([\s\S]+?)\5|\*([^*\n]+)\*|~~([\s\S]+?)~~|!\[([^\]]*)\]\(([^)]*)\)|\[([^\]]+)\]\(([^)]*)\)/g;
  var out=[],last=0,m;
  function push(arr){for(var k=0;k<arr.length;k++)out.push(arr[k]);}
  while((m=re.exec(s))){
    if(m.index>last)out.push(plainRun(s.slice(last,m.index),fmt));
    if(m[2]!==undefined)out.push(mkRun(m[2],fmt,{code:1}));
    else if(m[4]!==undefined)push(parseInline(m[4],merged(fmt,{b:1,i:1})));
    else if(m[6]!==undefined)push(parseInline(m[6],merged(fmt,{b:1})));
    else if(m[7]!==undefined)push(parseInline(m[7],merged(fmt,{i:1})));
    else if(m[8]!==undefined)push(parseInline(m[8],merged(fmt,{strike:1})));
    else if(m[10]!==undefined){                    // 图片：离线无法内嵌，转成链接/文字说明
      var alt=m[9]||'图片',url=m[10].split(' ')[0];
      if(/^https?:/i.test(url))out.push(mkRun('🖼 '+alt,fmt,{link:url}));
      else out.push(mkRun('〔图片：'+alt+(url?'（'+url+'）':'')+'〕',fmt,{}));
    }
    else if(m[12]!==undefined){
      var runs=parseInline(m[11],fmt),url2=m[12].split(' ')[0];
      runs.forEach(function(r){if(url2)r.link=url2;});
      push(runs);
    }
    last=m.index+m[0].length;
  }
  if(last<s.length)out.push(plainRun(s.slice(last),fmt));
  return out.filter(function(r){return r.text;});
}
function plainRun(t,fmt){return mkRun(t.replace(/\\([\\`*_{}\[\]()#+\-.!>|~])/g,'$1'),fmt,{});}
function mkRun(t,fmt,extra){
  var r={text:t};
  ['b','i','code','strike','link'].forEach(function(k){if(fmt[k])r[k]=fmt[k];});
  for(var k in extra)if(extra[k])r[k]=extra[k];
  return r;
}
function merged(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o;}

/* ══════════════════ 2. 结构 → Word（.docx 生成，纯手写 OOXML） ══════════════════ */
function xesc(s){return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var CALLOUT_LABEL={note:'📝 注',info:'ℹ️ 信息',tip:'💡 提示',hint:'💡 提示',important:'❗ 重要',warning:'⚠️ 注意',caution:'⚠️ 注意',danger:'🔥 危险',error:'❌ 错误',quote:'💬 引文',cite:'💬 引文',question:'❓ 问题',example:'📋 示例',abstract:'📄 摘要',summary:'📄 摘要',todo:'✅ 待办',success:'✅ 完成',failure:'❌ 失败',bug:'🐞 Bug'};

function runXml(r,ctx){
  var pr='';
  if(r.link)pr+='<w:rStyle w:val="Hyperlink"/>';
  if(r.code)pr+='<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>';
  if(r.b)pr+='<w:b/><w:bCs/>';
  if(r.i)pr+='<w:i/><w:iCs/>';
  if(r.strike)pr+='<w:strike/>';
  if(r.code)pr+='<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>';
  var body=String(r.text).split('\n').map(function(t){return '<w:t xml:space="preserve">'+xesc(t)+'</w:t>';}).join('<w:br/>');
  var x='<w:r>'+(pr?'<w:rPr>'+pr+'</w:rPr>':'')+body+'</w:r>';
  if(r.link&&/^(https?:|mailto:)/i.test(r.link)){
    var id='rId'+(100+ctx.links.length);ctx.links.push(r.link);
    x='<w:hyperlink r:id="'+id+'">'+x+'</w:hyperlink>';
  }
  return x;
}
function paraXml(runs,ppr,ctx){
  return '<w:p>'+(ppr?'<w:pPr>'+ppr+'</w:pPr>':'')+runs.map(function(r){return runXml(r,ctx);}).join('')+'</w:p>';
}
var HR_P='<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="BFBFBF"/></w:pBdr></w:pPr></w:p>';

function blockXml(b,ctx,opts){
  opts=opts||{};
  switch(b.t){
    case 'front':
      return b.pairs.map(function(kv){
        return paraXml([{text:(kv[0]?kv[0]+'：':'')+kv[1]}],'<w:pStyle w:val="Meta"/>',ctx);
      }).join('')+HR_P;
    case 'h':
      return paraXml(b.inl,'<w:pStyle w:val="Heading'+Math.min(b.level,6)+'"/>',ctx);
    case 'p':
      return paraXml(b.inl,opts.quote?'<w:pStyle w:val="Quote"/>':'',ctx);
    case 'hr':return HR_P;
    case 'code':
      return (b.lines.length?b.lines:['']).map(function(l){
        return paraXml([{text:l===''?' ':l}],'<w:pStyle w:val="CodeBlock"/>',ctx);
      }).join('');
    case 'quote':
      var inner='';
      if(b.callout){
        var label=CALLOUT_LABEL[b.callout.type]||b.callout.type;
        inner+=paraXml([{text:label+(b.callout.title?'　'+b.callout.title:''),b:1}],'<w:pStyle w:val="Quote"/>',ctx);
      }
      inner+=b.blocks.map(function(bb){return blockXml(bb,ctx,{quote:true});}).join('');
      return inner||paraXml([],'<w:pStyle w:val="Quote"/>',ctx);
    case 'list':return listXml(b,ctx,0,opts);
    case 'table':return tableXml(b,ctx);
  }
  return '';
}
function listXml(list,ctx,ilvl,opts){
  var numId=1;
  if(list.ordered){numId=ctx.ordSeq++;ctx.ordCount++;}
  return list.items.map(function(it){
    var xml='';
    if(it.inl.length||it.task!==null){
      var inl=it.inl.slice();
      if(it.task!==null)inl.unshift({text:it.task?'☑ ':'☐ '});
      xml+=paraXml(inl,'<w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="'+Math.min(ilvl,8)+'"/><w:numId w:val="'+numId+'"/></w:numPr>',ctx);
    }
    it.children.forEach(function(ch){xml+=listXml(ch,ctx,ilvl+1,opts);});
    return xml;
  }).join('');
}
function tableXml(b,ctx){
  var cols=Math.max(b.header.length,1);
  b.rows.forEach(function(r){if(r.length>cols)cols=r.length;});
  function pad(row){row=row.slice();while(row.length<cols)row.push([]);return row;}
  function tc(inl,head){
    var runs=head?inl.map(function(r){var o=merged(r,{});o.b=1;o.text=r.text;return o;}):inl;
    return '<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>'+(head?'<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>':'')+'</w:tcPr>'+paraXml(runs,'<w:spacing w:after="40"/>',ctx)+'</w:tc>';
  }
  var bd='<w:top w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/><w:left w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/><w:right w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>';
  var x='<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>'+bd+'</w:tblBorders><w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr>';
  x+='<w:tr>'+pad(b.header).map(function(c){return tc(c,true);}).join('')+'</w:tr>';
  b.rows.forEach(function(row){x+='<w:tr>'+pad(row).map(function(c){return tc(c,false);}).join('')+'</w:tr>';});
  return x+'</w:tbl><w:p/>';
}

var STYLES_XML='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
'<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="微软雅黑" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="en-US" w:eastAsia="zh-CN"/></w:rPr></w:rPrDefault>'+
'<w:pPrDefault><w:pPr><w:spacing w:after="140" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'+
'<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+
[[1,32,'1F3864'],[2,28,'2E5395'],[3,26,'2E5395'],[4,24,'404860'],[5,22,'404860'],[6,22,'606880']].map(function(h){
  return '<w:style w:type="paragraph" w:styleId="Heading'+h[0]+'"><w:name w:val="heading '+h[0]+'"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/>'+

function numberingXml(ordCount){

    lvD+='<w:lvl w:ilvl="'+l+'"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%'+(l+1)+'."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="'+(720*(l+1))+'" w:hanging="360"/></w:pPr></w:lvl>';
  }

  '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
  '<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>'+lvB+'</w:abstractNum>'+
  '<w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>'+lvD+'</w:abstractNum>'+
  '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>';
  for(var n2=0;n2<ordCount;n2++){

    for(l=0;l<9;l++)x+='<w:lvlOverride w:ilvl="'+l+'"><w:startOverride w:val="1"/></w:lvlOverride>';

}

function mdToDocxParts(mdText){

  var body=blocks.map(function(b){return blockXml(b,ctx,{});}).join('')||'<w:p/>';

  body+

      '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'+

    {name:'_rels/.rels',content:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+

    {name:'word/document.xml',content:doc},
    {name:'word/styles.xml',content:STYLES_XML},

function mdToDocxBytes(mdText){

}

async function unzip(buf){
  var u8=new Uint8Array(buf),dv=new DataView(buf);
  if(buf.byteLength<22)throw new Error('文件太小，不是有效的 .docx');
  var i=buf.byteLength-22,min=Math.max(0,buf.byteLength-22-65536);
  while(i>=min&&dv.getUint32(i,true)!==0x06054b50)i--;
  if(i<min)throw new Error('不是有效的 .docx（找不到压缩包目录）');
  var count=dv.getUint16(i+10,true),p=dv.getUint32(i+16,true);
  var files={},dec=new TextDecoder();
  for(var n2=0;n2<count;n2++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    var nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=dec.decode(u8.subarray(p+46,p+46+nlen));
    var start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    files[name]={method:method,data:u8.subarray(start,start+csize)};
    p+=46+nlen+elen+clen;
  }
  return {
    names:Object.keys(files),
    get:async function(name){
      var f=files[name];if(!f)return null;
      if(f.method===0)return f.data;
      if(f.method!==8)throw new Error('不支持的压缩方式（'+f.method+'）');
      if(typeof DecompressionStream==='undefined')throw new Error('浏览器版本太旧，不支持解压 .docx，请换新版 Edge / Chrome');
      var ab=await new Response(new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return new Uint8Array(ab);
    }
  };
}
function wattr(el,name){
  if(el.hasAttribute&&el.hasAttribute('w:'+name))return el.getAttribute('w:'+name);
  var a=el.attributes;
  if(a)for(var i=0;i<a.length;i++)if(a[i].localName===name)return a[i].value;
  return null;
}
function kids(el,name){var out=[],c=el&&el.firstChild;while(c){if(c.nodeType===1&&c.localName===name)out.push(c);c=c.nextSibling;}return out;}
function kid(el,name){return kids(el,name)[0]||null;}
function allEls(doc,name){
  var out=[],list=doc.getElementsByTagName('*');
  for(var i=0;i<list.length;i++)if(list[i].localName===name)out.push(list[i]);
  return out;
}
function wval(el){return el?wattr(el,'val'):null;}

async function docxToMd(buf){
  var z=await unzip(buf);
  var docBytes=await z.get('word/document.xml');
  if(!docBytes)throw new Error('压缩包里没有 word/document.xml —— 这不是 .docx。老 .doc 格式请先在 Word 里"另存为 .docx"再来转。');
  var dec=new TextDecoder();
  function parseXml(bytes){
    var d=new DOMParser().parseFromString(dec.decode(bytes),'application/xml');
    return d;
  }
  var doc=parseXml(docBytes);
  if(doc.getElementsByTagName('parsererror').length)throw new Error('word/document.xml 解析失败，文档可能损坏');

  // 样式表：识别标题 / 引用 / 代码块
  var headingOf={},quoteStyles={},codeStyles={};
  var stylesBytes=await z.get('word/styles.xml');
  if(stylesBytes){
    allEls(parseXml(stylesBytes),'style').forEach(function(st){
      if(wattr(st,'type')!=='paragraph')return;
      var id=wattr(st,'styleId');if(!id)return;
      var nm=(wval(kid(st,'name'))||'');
      var m=nm.match(/^heading\s*([1-6])$/i)||nm.match(/^标题\s*([1-6])$/)||id.match(/^Heading([1-6])$/i);
      if(m)headingOf[id]=+m[1];
      else{
        var ol=kid(kid(st,'pPr'),'outlineLvl');
        if(ol&&+wval(ol)<6)headingOf[id]=+wval(ol)+1;
      }
      if(/quote|引用/i.test(nm))quoteStyles[id]=1;
      if(/code|预设格式|HTML Preformatted/i.test(nm)||/code/i.test(id))codeStyles[id]=1;
    });
  }
  // 编号表：判断列表是圆点还是数字
  var absFmt={},numAbs={};
  var numBytes=await z.get('word/numbering.xml');
  if(numBytes){
    var nd=parseXml(numBytes);
    allEls(nd,'abstractNum').forEach(function(a){
      var map={};
      kids(a,'lvl').forEach(function(l){map[wattr(l,'ilvl')]=wval(kid(l,'numFmt'))||'decimal';});
      absFmt[wattr(a,'abstractNumId')]=map;
    });
    allEls(nd,'num').forEach(function(n2){numAbs[wattr(n2,'numId')]=wval(kid(n2,'abstractNumId'));});
  }
  // 关系表：超链接地址
  var rels={};
  var relBytes=await z.get('word/_rels/document.xml.rels');
  if(relBytes){
    allEls(parseXml(relBytes),'Relationship').forEach(function(r){
      var id=r.getAttribute('Id'),tg=r.getAttribute('Target');
      if(id&&tg)rels[id]=tg;
    });
  }

  function runInfo(r){
    var pr=kid(r,'rPr'),f={b:0,i:0,strike:0,code:0};
    if(pr){
      var on=function(n2){var e=kid(pr,n2);if(!e)return 0;var v=wattr(e,'val');return (v==null||!(v==='0'||v==='false'||v==='none'))?1:0;};
      f.b=on('b');f.i=on('i');f.strike=on('strike');
      var fonts=kid(pr,'rFonts');
      if(fonts&&/consolas|courier|mono/i.test(wattr(fonts,'ascii')||''))f.code=1;
      if(/code/i.test(wval(kid(pr,'rStyle'))||''))f.code=1;
    }
    var text='';
    for(var c=r.firstChild;c;c=c.nextSibling){
      if(c.nodeType!==1)continue;
      switch(c.localName){
        case 't':text+=c.textContent;break;
        case 'br':case 'cr':text+='\n';break;
        case 'tab':text+='\t';break;
        case 'drawing':case 'pict':case 'object':text+='〔图片〕';break;
        case 'noBreakHyphen':text+='-';break;
      }
    }
    return {text:text,f:f};
  }
  function inlineMd(p){
    var pieces=[];
    (function walk(el,link){
      for(var c=el.firstChild;c;c=c.nextSibling){
        if(c.nodeType!==1)continue;
        if(c.localName==='r'){var ri=runInfo(c);if(ri.text)pieces.push({text:ri.text,f:ri.f,link:link});}
        else if(c.localName==='hyperlink'){
          var id=null,a=c.attributes;
          for(var k=0;k<a.length;k++)if(a[k].localName==='id')id=a[k].value;
          walk(c,(id&&rels[id])||link);
        }
        else if(c.localName==='pPr'||c.localName==='rPr'){}
        else walk(c,link);
      }
    })(p,null);
    var mergedP=[];
    pieces.forEach(function(pc){
      var last=mergedP[mergedP.length-1];
      if(last&&last.link===pc.link&&last.f.b===pc.f.b&&last.f.i===pc.f.i&&last.f.strike===pc.f.strike&&last.f.code===pc.f.code)last.text+=pc.text;
      else mergedP.push(pc);
    });
    return mergedP.map(function(pc){
      var t=pc.text,lead=t.match(/^\s*/)[0];
      if(lead.length===t.length)return t;
      var trail=t.match(/\s*$/)[0],core=t.slice(lead.length,t.length-trail.length);
      if(pc.f.code)core='`'+core.replace(/`/g,'ˋ')+'`';
      else{
        if(pc.f.b&&pc.f.i)core='***'+core+'***';
        else if(pc.f.b)core='**'+core+'**';
        else if(pc.f.i)core='*'+core+'*';
        if(pc.f.strike)core='~~'+core+'~~';
      }
      if(pc.link)core='['+core+']('+pc.link+')';
      return lead+core+trail;
    }).join('');
  }

  var out=[],cnt={};
  function paraMd(p){
    var pPr=kid(p,'pPr');
    var styleId=pPr?wval(kid(pPr,'pStyle')):null;
    var numPr=pPr?kid(pPr,'numPr'):null;
    var text=inlineMd(p);
    if(styleId&&codeStyles[styleId]){out.push({code:true,text:text});return;}
    var h=styleId?headingOf[styleId]:0;
    if(h){if(text.trim())out.push({text:'#'.repeat(h)+' '+text.trim()});return;}
    if(numPr){
      var numId=wval(kid(numPr,'numId'))||'0',ilvl=+(wval(kid(numPr,'ilvl'))||0);
      var fmt=(absFmt[numAbs[numId]]||{})[String(ilvl)]||'bullet';
      var marker;
      if(fmt==='bullet')marker='- ';
      else{
        Object.keys(cnt).forEach(function(k){var kp=k.split(':');if(kp[0]===numId&&+kp[1]>ilvl)delete cnt[k];});
        var key=numId+':'+ilvl;
        cnt[key]=(cnt[key]||0)+1;marker=cnt[key]+'. ';
      }
      var pad='  '.repeat(Math.min(ilvl,8));
      out.push({li:true,text:pad+marker+text.replace(/\n/g,'\n'+pad+'  ')});
      return;
    }
    if(!text.trim()){out.push({blank:true});return;}
    if(styleId&&quoteStyles[styleId])text=text.split('\n').map(function(l){return '> '+l;}).join('\n');
    out.push({text:text});
  }
  function tableMd(tbl){
    var rows=kids(tbl,'tr').map(function(tr){
      return kids(tr,'tc').map(function(tc){
        var parts=[];
        kids(tc,'p').forEach(function(p){var t=inlineMd(p).trim();if(t)parts.push(t);});
        return parts.join('<br>').replace(/\|/g,'\\|').replace(/\n/g,'<br>');
      });
    }).filter(function(r){return r.length;});
    if(!rows.length)return;
    var cols=Math.max.apply(null,rows.map(function(r){return r.length;}));
    function pad(r){r=r.slice();while(r.length<cols)r.push('');return r;}
    var md='| '+pad(rows[0]).join(' | ')+' |\n|'+new Array(cols+1).join(' --- |');
    rows.slice(1).forEach(function(r){md+='\n| '+pad(r).join(' | ')+' |';});
    out.push({text:md});
  }
  function walkBlocks(el){
    for(var c=el.firstChild;c;c=c.nextSibling){
      if(c.nodeType!==1)continue;
      if(c.localName==='p')paraMd(c);
      else if(c.localName==='tbl')tableMd(c);
      else if(c.localName==='sectPr'){}
      else if(c.localName==='sdt'){var sc=kid(c,'sdtContent');if(sc)walkBlocks(sc);}
      else if(c.localName==='body'||c.localName==='sdtContent')walkBlocks(c);
    }
  }
  var body=allEls(doc,'body')[0];
  if(body)walkBlocks(body);

  var md='',inCode=false,prevLi=false;
  out.forEach(function(b){
    if(b.blank){if(inCode){md+='\n```';inCode=false;}prevLi=false;return;}
    if(b.code){
      if(!inCode){md+=(md?'\n\n':'')+'```';inCode=true;}
      md+='\n'+b.text;prevLi=false;return;
    }
    if(inCode){md+='\n```';inCode=false;}
    if(b.li&&prevLi)md+='\n'+b.text;
    else md+=(md?'\n\n':'')+b.text;
    prevLi=!!b.li;
  });
  if(inCode)md+='\n```';
  return md+(md?'\n':'');
}

/* ══════════════════ 4. JSON → Markdown（沿用原 JSON 转 MD 工具的逻辑） ══════════════════ */
function rawMsgs(c){return c.chat_messages||c.messages||[];}
function tsOf(m){var t=m&&(m.created_at||m.updated_at);var n=t?Date.parse(t):NaN;return isNaN(n)?0:n;}
function hasBody(m){return (typeof m.text==='string'&&m.text.trim())||(Array.isArray(m.content)&&m.content.length)||(m.attachments&&m.attachments.length)||(m.files&&m.files.length);}
function linearize(c){
  var msgs=rawMsgs(c);
  if(!Array.isArray(msgs)||msgs.length<=1)return msgs||[];
  var idKey=['uuid','id','message_id'].find(function(k){return msgs.some(function(m){return m&&m[k]!=null;});});
  var parentKey=['parent_message_uuid','parent_uuid','parent'].find(function(k){return msgs.some(function(m){return m&&m[k]!=null;});});
  if(!idKey||!parentKey)return msgs;
  var byId=new Map();
  msgs.forEach(function(m){if(m&&m[idKey]!=null)byId.set(String(m[idKey]),m);});
  var linked=msgs.filter(function(m){return m&&m[parentKey]!=null&&byId.has(String(m[parentKey]));}).length;
  if(!linked)return msgs;
  var leafId=c.current_leaf_message_uuid||c.current_leaf_uuid||c.leaf_message_uuid;
  leafId=leafId!=null?String(leafId):null;
  if(!leafId||!byId.has(leafId)){
    var parents=new Set(msgs.map(function(m){return (m&&m[parentKey]!=null)?String(m[parentKey]):null;}));
    var leaves=msgs.filter(function(m){return m&&m[idKey]!=null&&!parents.has(String(m[idKey]));});
    var bodyLeaves=leaves.filter(hasBody);
    var pool=(bodyLeaves.length?bodyLeaves:(leaves.length?leaves:msgs)).slice().sort(function(a,b){return tsOf(b)-tsOf(a);});
    leafId=String(pool[0][idKey]);
  }
  var chain=[],seen=new Set(),cur=leafId;
  while(cur&&byId.has(cur)&&!seen.has(cur)){seen.add(cur);chain.push(byId.get(cur));var p=byId.get(cur)[parentKey];cur=p!=null?String(p):null;}
  chain.reverse();
  return chain.length?chain:msgs;
}
function extractText(m){
  if(Array.isArray(m.content)){var t=m.content.filter(function(b){return b&&b.type==='text'&&typeof b.text==='string';}).map(function(b){return b.text;}).join('\n');if(t.trim())return t;}
  if(typeof m.text==='string'&&m.text.trim())return m.text;
  if(typeof m.content==='string')return m.content;
  return '';
}
function extractThinking(m){
  if(!Array.isArray(m.content))return '';
  return m.content.filter(function(b){return b&&b.type==='thinking';}).map(function(b){return (typeof b.thinking==='string'&&b.thinking)||(typeof b.text==='string'?b.text:'');}).filter(function(s){return s&&s.trim();}).join('\n\n');
}
function attContent(a){if(!a)return '';var v=a.extracted_content||a.extractedContent||a.file_content||a.content||a.text;return typeof v==='string'?v:'';}
function collectAttachments(m){
  var out=[],arrs=[];
  if(Array.isArray(m.attachments))arrs=arrs.concat(m.attachments);
  if(Array.isArray(m.files))arrs=arrs.concat(m.files);
  arrs.forEach(function(a){if(!a)return;var content=attContent(a);if(content&&content.trim())out.push({name:a.file_name||a.name||a.title||'附件',content:content});});
  return out;
}
function describeBlocks(m){
  var bits=[],arrs=[];
  if(Array.isArray(m.attachments))arrs=arrs.concat(m.attachments);
  if(Array.isArray(m.files))arrs=arrs.concat(m.files);
  arrs.forEach(function(a){if(!a)return;if(attContent(a).trim())return;bits.push('📎 文件：'+(a.file_name||a.name||'（图片/未命名，导出未含内容）'));});
  if(Array.isArray(m.content))m.content.forEach(function(b){if(!b||!b.type)return;if(b.type==='tool_use')bits.push('🔧 工具调用：'+(b.name||''));else if(b.type==='tool_result')bits.push('🔧 工具结果');else if(b.type==='image')bits.push('🖼️ 图片');});
  return bits;
}
function deriveTitle(thread){for(var i=0;i<thread.length;i++){var t=extractText(thread[i]).trim();if(t)return t.replace(/\s+/g,' ').slice(0,40);}return '';}
function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim().slice(0,80).replace(/[. ]+$/,'')||'未命名';}
function fmtDate(s){if(!s)return '';var d=new Date(s);if(isNaN(d))return '';var p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function fmtDT(s){if(!s)return '';var d=new Date(s);if(isNaN(d))return '';var p=function(n){return String(n).padStart(2,'0');};return fmtDate(s)+' '+p(d.getHours())+':'+p(d.getMinutes());}
function mdQuote(t){return t.split(/\r?\n/).map(function(l){return '> '+l;}).join('\n');}
function cjk(s){return s.replace(/\s/g,'').length;}
function convMd(c,thread,title,tag){
  var body='',rendered=0;
  thread.forEach(function(m){
    var isH=m.sender==='human'||m.sender==='user';
    var text=extractText(m).trim(),think=extractThinking(m).trim(),atts=collectAttachments(m),blocks=describeBlocks(m);
    if(!text&&!think&&!atts.length&&!blocks.length)return;
    rendered++;
    body+='## '+(isH?'🧑 你':'🤖 Claude')+'\n\n';
    if(text)body+=text+'\n\n';
    atts.forEach(function(a){body+='> [!quote]- 📎 '+a.name+'（'+cjk(a.content)+' 字）\n'+mdQuote(a.content)+'\n\n';});
    if(think)body+='> [!note]- 💭 思考过程（'+cjk(think)+' 字）\n'+mdQuote(think)+'\n\n';
    blocks.forEach(function(b){body+='> [!info] '+b+'\n\n';});
  });
  var md='---\ntitle: "'+title.replace(/"/g,"'")+'"\ncreated: '+fmtDT(c.created_at)+'\nupdated: '+fmtDT(c.updated_at)+'\nmessages: '+rendered+'\nuuid: '+(c.uuid||'')+'\ntags: ['+tag+']\n---\n\n# '+title+'\n\n> '+rendered+' 条消息 · '+fmtDT(c.created_at)+'\n\n---\n\n';
  return md+(body||'_（此条没有正文——通常是已删除的空对话，仅剩结构）_\n');
}
function valToMd(v,depth){
  if(v===null||v===undefined)return '_(空)_\n';
  if(typeof v==='string')return (v.trim()||'_(空字符串)_')+'\n';
  if(typeof v==='number'||typeof v==='boolean')return String(v)+'\n';
  if(Array.isArray(v)){
    if(!v.length)return '_(空数组)_\n';
    if(v.every(function(x){return x===null||typeof x!=='object';}))return v.map(function(x){return '- '+String(x);}).join('\n')+'\n';
    return v.map(function(x){return objToMd(x,depth);}).join('\n');
  }
  if(typeof v==='object')return objToMd(v,depth);
  return String(v)+'\n';
}
function objToMd(obj,depth){
  if(obj===null||typeof obj!=='object')return valToMd(obj,depth);
  var h=new Array(Math.min(depth,6)+1).join('#'),out='';
  Object.keys(obj).forEach(function(k){out+=h+' '+k+'\n\n'+valToMd(obj[k],depth+1)+'\n';});
  return out||'_(空对象)_\n';
}
function genTitle(item){
  if(item&&typeof item==='object'&&!Array.isArray(item)){
    var c=item.name||item.title;
    if(c&&String(c).trim())return String(c).replace(/\s+/g,' ').slice(0,60);
  }
  return '';
}
function genericMd(item,title,tag){
  var md='---\ntags: ['+tag+']\n';
  if(item&&typeof item==='object'&&item.created_at)md+='created: '+fmtDT(item.created_at)+'\n';
  md+='---\n\n# '+title+'\n\n';
  return md+valToMd(item,2);
}
function buildFiles(items,srcBase,tag){
  var files=[],used=new Set(),single=items.length===1;
  function uniq(base){var n=base,i=2;while(used.has(n.toLowerCase()))n=base+' ('+(i++)+')';used.add(n.toLowerCase());return n;}
  items.forEach(function(item,i){
    var isConv=item&&typeof item==='object'&&(Array.isArray(item.chat_messages)||Array.isArray(item.messages));
    var content,base;
    if(isConv){
      var thread=linearize(item);
      var title=(item.name&&String(item.name).trim())||deriveTitle(thread)||'（无标题）';
      var dateF=fmtDate(item.updated_at||item.created_at)||'无日期';
      content=convMd(item,thread,title,tag);
      base=single?srcBase:(dateF+'_'+title);
    }else{
      var gt=genTitle(item);
      content=genericMd(item, gt||(single?srcBase:(srcBase+' '+(i+1))), tag);
      base=single?srcBase:(gt||(srcBase+'-'+(i+1)));
    }
    files.push({name:uniq(safeName(base))+'.md',content:content});
  });
  if(files.length>1){
    var idx='# '+srcBase+' 索引（自动更新）\n\n'+
      '> 这页用 **Dataview** 自动列出文件夹里现存的条目：你删掉哪篇 .md，这里就自动少哪篇，不用手动改。\n'+
      '> ⚠️ 需先在 Obsidian 启用 Dataview 插件；没启用时下面会显示成一段代码而不是表格。\n\n'+
      '共 **'+files.length+'** 篇。\n\n'+
      '```dataview\nTABLE WITHOUT ID file.link AS "条目", created AS "创建时间", messages AS "消息数"\nFROM #'+tag+'\nSORT created DESC\n```\n';
    files.unshift({name:'_索引.md',content:idx});
  }
  return {files:files,items:items.length};
}
function jsonToMdFiles(text,fileName){
  var t=String(text).replace(/^﻿/,'').trim(),d=null;
  try{d=JSON.parse(t);}catch(e){d=null;}
  var items;
  if(d===null){
    items=t.split('\n').reduce(function(acc,l){l=l.trim();if(!l)return acc;try{acc.push(JSON.parse(l));}catch(_){}return acc;},[]);
    if(!items.length)throw new Error(fileName+' 不是有效的 JSON，无法解析。');
  }else if(Array.isArray(d)){
    if(!d.length)throw new Error(fileName+' 是空数组，没有条目可转。');
    items=d;
  }else items=[d];
  var srcBase=(fileName||'export').replace(/\.[^.]+$/,'')||'export';
  var tag=srcBase.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if(!tag||/^[0-9-]+$/.test(tag))tag='export';
  var r=buildFiles(items,srcBase,tag);
  return {files:r.files,items:r.items,srcBase:safeName(srcBase)};
}

/* ══════════════════ 5. 纯 JS ZIP（store + CRC32） ══════════════════ */
var CRC=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(items){
  var parts=[],central=[],offset=0;
  items.forEach(function(f){
    var nb=ENC.encode(f.name),data=f.data,crc=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);
    ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);
    ch.setUint32(38,0,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nb);
    offset+=30+nb.length+data.length;
  });
  var cSize=0;central.forEach(function(p){cSize+=p.length;});
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);
  end.setUint16(8,items.length,true);end.setUint16(10,items.length,true);
  end.setUint32(12,cSize,true);end.setUint32(16,offset,true);end.setUint16(20,0,true);
  var all=parts.concat(central,[new Uint8Array(end.buffer)]);
  var len=0;all.forEach(function(p){len+=p.length;});
  var out=new Uint8Array(len),o=0;
  all.forEach(function(p){out.set(p,o);o+=p.length;});
  return out;
}

/* ══════════════════ 6. 界面交互 ══════════════════ */
var INPUT=[];
var FMT={md:{label:'Markdown (.md)'},docx:{label:'Word (.docx)'},json:{label:'JSON (.json)'}};
var TARGETS={md:['docx'],docx:['md'],json:['md','docx']};
var SRC='md',DST='docx';
function show(msg,bad){var m=$('msg');m.textContent=msg;m.className=bad?'bad':'';}
function baseName(n){return n.replace(/\.[^.]+$/,'');}

function detectKind(name,buf){
  var ext=(name.match(/\.([^.]+)$/)||[,''])[1].toLowerCase();
  if(ext==='docx')return 'docx';
  if(ext==='json'||ext==='jsonl')return 'json';
  if(ext==='md'||ext==='markdown'||ext==='txt')return 'md';
  var u8=new Uint8Array(buf,0,Math.min(4,buf.byteLength));
  if(u8[0]===0x50&&u8[1]===0x4B)return 'docx';
  var t=new TextDecoder().decode(buf).replace(/^﻿/,'').trim();
  try{JSON.parse(t);return 'json';}catch(e){}
  return 'md';
}
function addFiles(fileList){
  INPUT=[];
  var files=Array.prototype.slice.call(fileList);
  if(!files.length)return;
  show('正在读取…');
  var pending=files.length;
  files.forEach(function(f){
    var r=new FileReader();
    r.onerror=function(){pending--;show('读取 '+f.name+' 失败',true);if(!pending)filesLoaded();};
    r.onload=function(e){
      var buf=e.target.result,kind=detectKind(f.name,buf);
      var entry={name:f.name,kind:kind};
      if(kind==='docx')entry.buf=buf;
      else entry.text=new TextDecoder().decode(buf).replace(/^﻿/,'');
      INPUT.push(entry);
      pending--;if(!pending)filesLoaded();
    };
    r.readAsArrayBuffer(f);
  });
}
var KIND_LABEL={md:'Markdown',docx:'Word',json:'JSON'};
function filesLoaded(){
  if(INPUT.length){
    var counts={};
    INPUT.forEach(function(f){counts[f.kind]=(counts[f.kind]||0)+1;});
    SRC=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];})[0];
    if(TARGETS[SRC].indexOf(DST)<0)DST=TARGETS[SRC][0];
  }
  refresh();
}
function setSrc(k){SRC=k;if(TARGETS[SRC].indexOf(DST)<0)DST=TARGETS[SRC][0];refresh();}
function setDst(k){DST=k;refresh();}
function refresh(){
  $('sel-src').querySelector('.cur').textContent=FMT[SRC].label;
  $('sel-dst').querySelector('.cur').textContent=FMT[DST].label;
  var fl=$('flist');fl.innerHTML='';
  INPUT.forEach(function(f){
    var row=document.createElement('div');row.className='frow'+(f.kind===SRC?'':' dim');
    var nm=document.createElement('span');nm.className='nm';nm.textContent=f.name;
    var bd=document.createElement('span');bd.className='badge';bd.textContent=KIND_LABEL[f.kind];
    row.appendChild(nm);row.appendChild(bd);fl.appendChild(row);
  });
  var match=INPUT.filter(function(f){return f.kind===SRC;}).length;
  $('btn-go').textContent='开始转换：'+FMT[SRC].label+' → '+FMT[DST].label+(INPUT.length?'（'+match+' 个文件）':'');
  $('note').textContent=noteFor(SRC,DST);
  if(INPUT.length){
    $('panel').style.display='block';
    if(!match)show('左边选的是 '+FMT[SRC].label+'，但拖入的文件里没有这种格式——换一下左边的下拉框，或重新选文件。',true);
    else show('已就绪：'+match+' 个 '+KIND_LABEL[SRC]+' 文件 → '+FMT[DST].label+'，点「开始转换」。'+(match<INPUT.length?'（另 '+(INPUT.length-match)+' 个格式不符已变灰，会跳过）':''));
  }
}
function noteFor(src,dst){
  if(src==='md')return 'MD → Word：标题/加粗/斜体/列表/表格/代码块/引用/链接都会保留；网络图片以链接形式出现（离线工具不下载图片）。';
  if(src==='docx')return 'Word → MD：只支持 .docx；文档里的图片不会带入 MD（会标记〔图片〕）。老 .doc 请先用 Word 另存为 .docx。';
  return dst==='docx'?'JSON → Word：数组里每一条 = 一个 .docx（不生成 Obsidian 索引页）。':'JSON → MD：数组里每一条 = 一篇，多条时附带 Dataview 索引（Obsidian 用）。';
}
function closeMenus(except){
  var ms=document.querySelectorAll('.menu.open');
  for(var i=0;i<ms.length;i++)if(ms[i]!==except)ms[i].classList.remove('open');
}
function setupMenu(btnId,menuId,optsFn,curFn,pickFn){
  var btn=$(btnId),menu=$(menuId);
  btn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    if(menu.classList.contains('open')){menu.classList.remove('open');return;}
    closeMenus();
    menu.innerHTML='';
    optsFn().forEach(function(k){
      var d=document.createElement('div');
      d.className='opt'+(k===curFn()?' on':'');
      d.textContent=FMT[k].label;
      d.addEventListener('click',function(ev){ev.stopPropagation();menu.classList.remove('open');pickFn(k);});
      menu.appendChild(d);
    });
    menu.classList.add('open');
  });
}
setupMenu('sel-src','menu-src',function(){return ['md','docx','json'];},function(){return SRC;},setSrc);
setupMenu('sel-dst','menu-dst',function(){return TARGETS[SRC];},function(){return DST;},setDst);
document.addEventListener('click',function(){closeMenus();});
$('btn-go').addEventListener('click',function(){
  var files=INPUT.filter(function(f){return f.kind===SRC;});
  if(!files.length){show('还没有 '+FMT[SRC].label+' 文件：先把文件拖进上面的虚线框。',true);return;}
  var btn=$('btn-go');btn.disabled=true;
  var run;
  if(SRC==='md')run=function(){return convMdToDocx(files);};
  else if(SRC==='docx')run=function(){return convDocxToMd(files);};
  else run=function(){return convJson(files,DST);};
  Promise.resolve().then(run).catch(function(err){show('转换出错：'+(err&&err.message||err),true);}).then(function(){btn.disabled=false;});
});
refresh();

function uniqNamer(){
  var used=new Set();
  return function(n){
    var base=n.replace(/(\.[^.]+)$/,''),ext=(n.match(/\.[^.]+$/)||[''])[0],out=n,i=2;
    while(used.has(out.toLowerCase())){out=base+' ('+(i++)+')'+ext;}
    used.add(out.toLowerCase());return out;
  };
}
function download(outs,zipBase){
  if(!outs.length){show('没有可下载的结果',true);return;}
  if(outs.length===1){
    var o=outs[0];
    var blob=o.u8?new Blob([o.u8],{type:o.mime||'application/octet-stream'}):new Blob([o.text],{type:'text/markdown;charset=utf-8'});
    trigger(blob,o.name);
    show('已下载 '+o.name);
  }else{
    var items=outs.map(function(o2){return {name:o2.name,data:o2.u8||ENC.encode(o2.text)};});
    var zipName=safeName(zipBase||'转换结果')+'.zip';
    trigger(new Blob([makeZip(items)],{type:'application/zip'}),zipName);
    show('已下载 '+zipName+'，含 '+outs.length+' 个文件，解压即用。');
  }
}
function trigger(blob,name){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
}

function convMdToDocx(mds){
  var uniq=uniqNamer(),outs=[];
  mds.forEach(function(f){
    outs.push({name:uniq(safeName(baseName(f.name))+'.docx'),u8:mdToDocxBytes(f.text),mime:DOCX_MIME});
  });
  download(outs,mds.length===1?baseName(mds[0].name):'MD转Word');
}
async function convDocxToMd(docs){
  var uniq=uniqNamer(),outs=[],errs=[];
  for(var i=0;i<docs.length;i++){
    try{
      var md=await docxToMd(docs[i].buf);
      outs.push({name:uniq(safeName(baseName(docs[i].name))+'.md'),text:md});
    }catch(e){errs.push(docs[i].name+'：'+(e&&e.message||e));}
  }
  download(outs,docs.length===1?baseName(docs[0].name):'Word转MD');
  if(errs.length)show('部分文件转换失败：\n'+errs.join('\n'),true);
}
function convJson(jss,target){
  var uniq=uniqNamer(),outs=[],errs=[],multiSrc=jss.length>1;
  jss.forEach(function(f){
    var r;
    try{r=jsonToMdFiles(f.text,f.name);}catch(e){errs.push(e&&e.message||String(e));return;}
    r.files.forEach(function(mf){
      if(target==='docx'&&mf.name==='_索引.md')return;   // 索引页是 Obsidian 专用，Word 版不需要
      var prefix=(multiSrc||r.files.length>1)?r.srcBase+'/':'';
      if(target==='md')outs.push({name:uniq(prefix+mf.name),text:mf.content});
      else outs.push({name:uniq(prefix+mf.name.replace(/\.md$/,'.docx')),u8:mdToDocxBytes(mf.content),mime:DOCX_MIME});
    });
  });
  if(errs.length&&!outs.length){show(errs.join('\n'),true);return;}
  download(outs,jss.length===1?baseName(jss[0].name)+(target==='docx'?'_Word':''):'JSON转换结果');
  if(errs.length)show('部分文件转换失败：\n'+errs.join('\n'),true);
}

var drop=$('drop'),fileInput=$('file');
fileInput.addEventListener('change',function(e){if(e.target.files&&e.target.files.length)addFiles(e.target.files);});
drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',function(){drop.classList.remove('over');});
drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});

// 暴露内部函数，便于自动化测试（不影响正常使用）
window.MDWX={parseMd:parseMd,mdToDocxBytes:mdToDocxBytes,mdToDocxParts:mdToDocxParts,docxToMd:docxToMd,unzip:unzip,jsonToMdFiles:jsonToMdFiles,makeZip:makeZip};

var rd=$('ready');rd.textContent='✅ 工具已就绪：拖入或点击上方选择文件（.md / .docx / .json）';rd.className='on';
})();
